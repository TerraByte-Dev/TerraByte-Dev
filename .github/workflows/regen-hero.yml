name: regen-hero

# Self-rewriting hero: redraws both realities (neon + blueprint) every day so the
# profile is never the same twice — generative starfield reseeds, DAY counter ticks,
# total-stars stamp refreshes, blueprint REV date updates. Then rebuilds the dark
# hero's animated banner (3D globe + travelling CRT sweep) from the fresh SVG.
# Bumps the README cache-bust so GitHub's image proxy refetches. Runs on a
# schedule, on manual dispatch, and whenever the generator changes.
on:
  schedule:
    - cron: "17 7 * * *"      # daily, ~07:17 UTC
  workflow_dispatch:
  push:
    paths:
      - gen_hero.py
      - assets/wordmarks.json
      - tools/**
      - .github/workflows/regen-hero.yml

permissions:
  contents: write

concurrency:
  group: regen-hero
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count stars across owned repos
        id: stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api graphql -f query='
            { user(login: "${{ github.repository_owner }}") {
                repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                  nodes { stargazerCount } } } }' \
            --jq '[.data.user.repositories.nodes[].stargazerCount] | add // 0')
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "total stars: $N"

      - name: Redraw both realities (today's seed / uptime / rev / stars)
        run: python gen_hero.py --stars "${{ steps.stars.outputs.count }}"

      # The dark hero is a composited animation, so it must be rebuilt whenever the
      # SVG changes or it would freeze yesterday's DAY counter and star count.
      # Best-effort: if this fails, the SVG redraw below still commits.
      - name: Rebuild the animated dark hero
        id: banner
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pillow playwright numpy
          python -m playwright install --with-deps chromium
          gh release download globe-pack-v1 -p globe-pack-1113.webp -O /tmp/globe-pack.webp --clobber
          python tools/prep_plates.py --svg assets/hero-online.svg --out /tmp/plates --scale 3
          python tools/build_banner.py \
            --plate  /tmp/plates/plate_2x.png \
            --glitch /tmp/plates/plate_glitch_2x.png \
            --globe  /tmp/globe-pack.webp \
            --out    /tmp/bnr --cycles 2 --width 1920 --grain 0
          python tools/encode_banner.py --in /tmp/bnr --out assets/hero-globe.webp \
            --fps 25 --quality 92
          ls -l assets/hero-globe.webp

      - name: Commit if the system changed
        run: |
          DAY=$(date -u +%Y%m%d)
          sed -i -E "s/hero-(online|blueprint)\.svg\?v=[0-9A-Za-z]+/hero-\1.svg?v=$DAY/g" README.md
          sed -i -E "s/hero-globe\.webp\?v=[0-9A-Za-z]+/hero-globe.webp?v=$DAY/g" README.md
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "terrabyte-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: self-rewrite hero $DAY [skip ci]"
            git push
            echo "hero redrawn for $DAY (banner: ${{ steps.banner.outcome }})"
          else
            echo "no change today"
          fi
